<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0E9F6E">
    <meta name="description" content="친구들이 보는 진짜 나의 모습을 6가지 성격 유형으로 분석해보세요">
    <title>Let me Know me</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- 히어로 섹션 -->
        <section class="hero-section">
            <h1>Let me Know me</h1>
            <p class="subtitle">친구들이 보는 진짜 '나'의 모습을 발견해보세요</p>

            <!-- 링크 생성 섹션 -->
            <div class="create-section" id="create-section">
                <div class="input-group">
                    <label for="name-input" class="sr-only">이름 또는 닉네임</label>
                    <input type="text" id="name-input" name="name" autocomplete="name" placeholder="이름(닉네임)을 입력하세요" maxlength="20">
                    <button id="create-btn" class="btn-primary">내 리포트 링크 만들기</button>
                </div>
                <p class="help-text">친구들에게 공유할 설문 링크를 생성합니다</p>
            </div>

            <!-- 생성된 링크 표시 영역 -->
            <div class="link-display-area" id="link-display-area" style="display: none;">
                <div class="success-message">
                    <h3>링크가 생성되었습니다!</h3>
                    <div class="link-container">
                        <div class="link-item">
                            <label for="feedback-link">친구들에게 공유할 설문 링크:</label>
                            <div class="link-box">
                                <input type="text" id="feedback-link" readonly>
                                <button class="copy-btn" data-target="feedback-link" aria-label="설문 링크 복사">복사</button>
                            </div>
                        </div>
                        <div class="link-item">
                            <label for="result-link">내 결과 확인 링크:</label>
                            <div class="link-box">
                                <input type="text" id="result-link" readonly>
                                <button class="copy-btn" data-target="result-link" aria-label="결과 링크 복사">복사</button>
                            </div>
                        </div>
                    </div>
                    <button id="create-another-btn" class="btn-secondary">다시 만들기</button>
                </div>
            </div>
        </section>

        <!-- 이용 방법 섹션 -->
        <section class="how-it-works">
            <h2>이용 방법</h2>
            <div class="steps-grid">
                <div class="step-card">
                    <div class="step-number">1</div>
                    <h3>링크 생성</h3>
                    <p>이름을 입력하고 나만의 설문 링크를 만드세요</p>
                </div>
                <div class="step-card">
                    <div class="step-number">2</div>
                    <h3>친구에게 공유</h3>
                    <p>설문 링크를 친구들에게 보내 답변을 받아보세요</p>
                </div>
                <div class="step-card">
                    <div class="step-number">3</div>
                    <h3>결과 확인</h3>
                    <p>5명 이상 응답이 모이면 성격 분석 리포트를 확인하세요</p>
                </div>
            </div>
        </section>

        <!-- 최근 리포트 목록 -->
        <section class="recent-reports">
            <h2>최근에 생성된 리포트</h2>
            <div id="report-list" class="report-list">
                <div class="loading">리포트 목록을 불러오는 중...</div>
            </div>
        </section>

        <footer class="footer-dark">
            <p>&copy; 2025 Let me Know me. 나를 알아가는 여정을 시작해보세요.</p>
        </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
